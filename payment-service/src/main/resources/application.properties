spring.application.name=payment-service
server.port=8084

spring.config.import=optional:file:.env[.properties]

server.error.include-stacktrace=ALWAYS
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:postgresql://localhost:5432/payments_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

jwt-secret=${JWT_SECRET}
jwt-expiration-ms=86400000

audit-service.url=http://localhost:8086
car-service.url=http://localhost:8082
notification-service.url=http://localhost:8085
booking-service.url=http://localhost:8083

internal.api-key=${INTERNAL_API_KEY}


app.stripe.secret.key = ${STRIPE_TEST_SECRET_KEY}
app.stripe.webhook.secret=${STRIPE_WEB_HOOK_SECRET}

# Where Stripe sends the customer back after checkout (the React app)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}


