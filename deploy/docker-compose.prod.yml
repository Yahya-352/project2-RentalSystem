# Production stack for the AWS app server. The database is RDS (no postgres container),
# images come from ECR, and every setting comes from app.env, which deploy.sh builds from
# SSM Parameter Store. REGISTRY and IMAGE_TAG are written to .env by deploy.sh.
# Container logs go to CloudWatch through the Docker daemon configured in user_data.

x-service: &service
  restart: unless-stopped
  env_file: app.env
  depends_on:
    kafka:
      condition: service_healthy

x-env: &env
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  JAVA_OPTS: -Xmx192m -Xss512k -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC

services:
  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1" ]
      interval: 15s
      retries: 20

  user-service:
    <<: *service
    image: ${REGISTRY}/rentride/user-service:${IMAGE_TAG}
    ports: [ "8081:8081" ]
    environment: *env
    volumes:
      - ./uploads:/app/uploads

  car-service:
    <<: *service
    image: ${REGISTRY}/rentride/car-service:${IMAGE_TAG}
    ports: [ "8082:8082" ]
    environment: *env
    volumes:
      - ./uploads:/app/uploads

  booking-service:
    <<: *service
    image: ${REGISTRY}/rentride/booking-service:${IMAGE_TAG}
    ports: [ "8083:8083" ]
    environment:
      <<: *env
      CARSERVICE_URL: http://car-service:8082
      PAYMENTSERVICE_URL: http://payment-service:8084

  payment-service:
    <<: *service
    image: ${REGISTRY}/rentride/payment-service:${IMAGE_TAG}
    ports: [ "8084:8084" ]
    environment:
      <<: *env
      CARSERVICE_URL: http://car-service:8082
      BOOKINGSERVICE_URL: http://booking-service:8083

  notification-service:
    <<: *service
    image: ${REGISTRY}/rentride/notification-service:${IMAGE_TAG}
    ports: [ "8085:8085" ]
    environment: *env

  audit-service:
    <<: *service
    image: ${REGISTRY}/rentride/audit-service:${IMAGE_TAG}
    ports: [ "8086:8086" ]
    environment: *env
